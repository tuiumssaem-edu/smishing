<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수상한 메시지 미션</title>
<style>
/* =========================================================
   수상한 메시지 미션 - 특수교육 기능적 생활기술 시뮬레이터
   외부 리소스 0개 / 오프라인 100% 동작 / 저장소 미사용
   ========================================================= */
:root{
  --red:#d62828; --red-dark:#a4161a; --red-bg:#fff1f1;
  --green:#15803d; --green-bright:#22a447; --green-bg:#ecfdf3;
  --yellow:#ffe63b; --yellow-soft:#fff8c7;
  --blue-link:#1749d6;
  --slate:#334155; --purple:#6d28d9;
  --ink:#16202f; --muted:#556070; --page:#dde5ee;
  --font:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Nanum Gothic",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);background:var(--page);color:var(--ink);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font-family:inherit;cursor:pointer;-webkit-touch-callout:none;touch-action:manipulation}
button:focus-visible{outline:4px solid #0b5fff;outline-offset:3px}

#app{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 12px 14px}

/* ---------- 진행률 ---------- */
.progress{width:100%;text-align:center;margin-bottom:8px}
.progress-label{font-size:30px;font-weight:900;letter-spacing:-.5px}
.progress-label b{color:var(--blue-link)}
.progress-bar{display:flex;gap:6px;justify-content:center;margin-top:6px}
.progress-bar span{flex:1;max-width:40px;height:10px;border-radius:6px;background:#b9c4d2}
.progress-bar span.done-ok{background:var(--green-bright)}
.progress-bar span.done-retry{background:#f08c00}
.progress-bar span.now{background:#fff;box-shadow:0 0 0 3px var(--blue-link)}

/* ---------- 스마트폰 프레임 ---------- */
.phone{
  position:relative;height:86vh;height:86dvh;min-height:620px;
  width:min(100%, max(360px, calc(86vh * 0.6)));
  background:#1a1d24;border-radius:52px;padding:13px;
  box-shadow:0 30px 60px rgba(20,30,50,.35),0 0 0 2px #464c5a inset,0 0 0 3px #0e1015;
}
.phone::before{content:"";position:absolute;right:-5px;top:20%;width:5px;height:76px;border-radius:0 4px 4px 0;background:#2c313c}
.phone::after{content:"";position:absolute;left:-5px;top:16%;width:5px;height:110px;border-radius:4px 0 0 4px;background:#2c313c}
.speaker{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:76px;height:4px;border-radius:4px;background:#3c4352;z-index:6}
.screen{position:relative;height:100%;background:#fff;border-radius:40px;overflow:hidden;display:flex;flex-direction:column}
.punch{position:absolute;top:9px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#0d0f14;box-shadow:inset 0 0 0 3px #222838,inset 2px 2px 0 5px #0d0f14;z-index:7}

/* 상태표시줄 */
.statusbar{flex:none;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:16px;font-weight:800;background:#fff;position:relative;z-index:5}
.sb-right{display:flex;align-items:center;gap:7px}
.signal{display:flex;align-items:flex-end;gap:2px;height:14px}
.signal i{display:block;width:3px;background:var(--ink);border-radius:1px}
.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:10px}.signal i:nth-child(4){height:13px}
.net{font-size:13px;font-weight:900}
.wifi{width:15px;height:15px;position:relative;margin-top:4px}
.wifi::before{content:"";position:absolute;left:0;top:0;width:15px;height:15px;background:var(--ink);border-radius:100% 0 0 0;transform:rotate(45deg);transform-origin:center}
.battery{display:flex;align-items:center;gap:3px;font-size:13px}
.batt{width:26px;height:13px;border:2px solid var(--ink);border-radius:4px;padding:1px;position:relative}
.batt::after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;background:var(--ink);border-radius:0 2px 2px 0}
.batt i{display:block;width:100%;height:100%;background:var(--green-bright);border-radius:1px}

/* 화면 스크롤 영역 */
.scroller{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}

/* 앱 헤더 */
.appbar{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid #e3e7ee;position:sticky;top:0;z-index:4}
.appbar .back{font-size:34px;font-weight:300;color:var(--muted);width:20px;text-align:center}
.avatar{flex:none;width:50px;height:50px;border-radius:50%;background:#d6dbe3;display:flex;align-items:center;justify-content:center;font-size:28px}
.sender-name{font-size:23px;font-weight:800;line-height:1.3;word-break:keep-all}
.sender-sub{font-size:16px;color:var(--muted);margin-top:2px}
.addr{flex:1;display:flex;align-items:center;gap:8px;background:#eef1f5;border-radius:24px;padding:10px 16px;font-size:20px;font-weight:700;color:#3a4352}
.addr .lock{color:var(--red);font-weight:900}

/* 메시지 영역 */
.msgarea{flex:1 0 auto;min-height:230px;padding:16px 16px 20px;background:#f2f4f8;position:relative}
.msgarea.chat{background:#d9e5f0}
.msgarea.popup{background:
  repeating-linear-gradient(180deg,#ffffff 0 18px,#e7eaf0 18px 30px,#ffffff 30px 44px);padding:22px 16px}
.msgarea.popup::before{content:"";position:absolute;inset:0;background:rgba(20,25,35,.55)}
.datechip{display:table;margin:0 auto 14px;background:rgba(0,0,0,.12);color:#2b3442;font-size:16px;font-weight:700;padding:5px 14px;border-radius:20px}
.stranger{background:#fff4d6;border:2px solid #f2b705;color:#6b4e00;font-size:19px;font-weight:700;border-radius:14px;padding:10px 14px;margin-bottom:14px;text-align:center}
.bubble-row{display:flex;gap:10px;align-items:flex-start;transition:transform .5s,opacity .5s}
.bubble-row .avatar{width:44px;height:44px;font-size:24px}
.bubble{background:#fff;border-radius:6px 22px 22px 22px;padding:16px 18px;font-size:24px;line-height:1.55;max-width:88%;box-shadow:0 1px 2px rgba(0,0,0,.12);word-break:keep-all;overflow-wrap:anywhere}
.msgarea.sms .bubble{background:#fff}
.bubble-time{font-size:15px;color:var(--muted);align-self:flex-end;white-space:nowrap}
.danger-link{display:block;width:100%;margin-top:10px;min-height:52px;padding:6px 4px;background:none;border:none;border-radius:8px;color:var(--blue-link);text-decoration:underline;text-underline-offset:4px;font-size:24px;font-weight:700;text-align:left;word-break:break-all}
.removing{transform:translateX(120%) scale(.8);opacity:0}

/* 가짜 팝업 */
.popup-card{position:relative;z-index:1;background:#fff;border-radius:22px;padding:22px 20px 20px;border-top:10px solid var(--red);box-shadow:0 12px 30px rgba(0,0,0,.4);transition:transform .45s,opacity .45s}
.popup-card.closing{transform:scale(.3);opacity:0}
.popup-ad{position:absolute;top:10px;right:14px;font-size:14px;color:#8a93a3;border:1px solid #c9ced8;border-radius:6px;padding:1px 6px}
.popup-title{font-size:27px;font-weight:900;color:var(--red);margin:6px 0 10px;line-height:1.35;word-break:keep-all}
.popup-text{font-size:24px;line-height:1.55;margin:0 0 16px;word-break:keep-all}
.danger-btn{display:block;width:100%;min-height:64px;border:none;border-radius:16px;background:var(--red);color:#fff;font-size:24px;font-weight:900;animation:lure 1.2s infinite}
@keyframes lure{50%{transform:scale(1.03)}}

/* ---------- 단서 형광펜 하이라이트 (1:1 매핑) ---------- */
.hl{border-radius:6px;transition:background-color .25s,box-shadow .25s,outline-color .25s}
.phone.on1 .hl1,.phone.on2 .hl2,.phone.on3 .danger-link.hl3{background:var(--yellow);box-shadow:0 0 0 4px var(--yellow);color:#111}
.phone.on3 .danger-link.hl3{color:var(--blue-link)}
.phone.on3 .danger-btn.hl3{outline:7px solid var(--yellow);outline-offset:3px}

/* ---------- 수상한 점 확인 패널 ---------- */
.checkpanel{flex:none;background:var(--yellow-soft);border-top:4px solid #f0c400;padding:10px 14px 8px}
.check-title{font-size:22px;font-weight:900;margin:2px 0 6px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:14px;transition:background .2s}
.qtext{font-size:21px;font-weight:700;line-height:1.35;word-break:keep-all;display:flex;gap:8px;align-items:flex-start}
.qnum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.oxgroup{display:flex;gap:8px}
.ox{width:62px;height:58px;border-radius:16px;border:3px solid #b8c0cc;background:#fff;font-size:30px;font-weight:900;color:#475266;transition:transform .1s}
.ox:active{transform:scale(.94)}
.ox.o[aria-pressed="true"]{background:#1d5fe0;border-color:#1d5fe0;color:#fff}
.ox.x[aria-pressed="true"]{background:#4b5568;border-color:#4b5568;color:#fff}
.qrow.wrong{background:#ffe2bf;box-shadow:inset 0 0 0 3px #f08c00;animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.hintline{min-height:26px;font-size:19px;font-weight:700;color:#8a4b00;text-align:center;padding:2px 4px}
.hintline.good{color:var(--green)}

/* ---------- 행동 버튼 ---------- */
.actionbar{flex:none;background:#fff;border-top:1px solid #e3e7ee;padding:10px 12px 14px;display:flex;flex-direction:column;gap:9px}
.actions{display:grid;gap:8px}
.act{min-height:60px;border:none;border-radius:16px;font-size:22px;font-weight:900;color:#fff;padding:6px 4px;transition:opacity .2s,filter .2s,transform .1s}
.act:active{transform:scale(.96)}
.act.del,.act.blk,.act.cls{background:var(--slate)}
.act.ok{background:var(--green)}
.act.locked{opacity:.38;filter:grayscale(1)}
.act.pulse{animation:pulse 1.1s infinite;box-shadow:0 0 0 0 rgba(34,164,71,.7)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,164,71,.75)}70%{box-shadow:0 0 0 14px rgba(34,164,71,0);transform:scale(1.04)}100%{box-shadow:0 0 0 0 rgba(34,164,71,0)}}
.act.adult{background:var(--purple);min-height:58px}

/* 폰 안 토스트 */
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.8);background:rgba(20,25,35,.92);color:#fff;font-size:24px;font-weight:800;padding:18px 26px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- 모달 ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.overlay.show{display:flex}
.modal{width:min(100%,540px);max-height:92vh;overflow-y:auto;background:#fff;border-radius:30px;padding:28px 24px 24px;text-align:center;border:7px solid #c9d0db;animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal.danger{border-color:var(--red);background:var(--red-bg);animation:pop .28s ease-out,shake .5s .28s}
.modal.success{border-color:var(--green-bright);background:var(--green-bg)}
.modal.info{border-color:var(--purple);background:#f6f1ff}
.modal.notice{border-color:#f08c00;background:#fff7ea}
.modal-icon{font-size:66px;line-height:1.1}
.modal h2{font-size:29px;line-height:1.35;margin:10px 0 12px;word-break:keep-all}
.modal.danger h2{color:var(--red-dark)}
.modal.success h2{color:var(--green)}
.modal p{font-size:23px;line-height:1.55;margin:0 0 12px;word-break:keep-all}
.tipbox{background:#fff;border:3px dashed var(--green-bright);border-radius:18px;padding:12px 14px;font-size:22px;line-height:1.5;margin:6px 0 16px;word-break:keep-all;text-align:left}
.dangerbox{background:#fff;border:3px solid #f3b4b4;border-radius:18px;padding:12px 14px;font-size:22px;line-height:1.5;margin:6px 0 16px;word-break:keep-all;text-align:left}
.mbtns{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.mbtn{min-height:64px;border:none;border-radius:18px;font-size:24px;font-weight:900;color:#fff;background:var(--slate)}
.mbtn.red{background:var(--red)}
.mbtn.green{background:var(--green)}
.mbtn.purple{background:var(--purple)}
.mbtn.light{background:#e4e8ef;color:var(--ink)}
.holdbtn{position:relative;overflow:hidden;background:#3b2a6b}
.holdbtn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green-bright)}
.holdbtn.holding .fill{width:100%;transition:width 2s linear}
.holdbtn .lbl{position:relative}

/* ---------- 결과 화면 ---------- */
.results{width:100%;background:#fff;border-radius:30px;padding:26px 20px;box-shadow:0 20px 40px rgba(20,30,50,.18);display:none}
.results.show{display:block}
.badge{text-align:center}
.badge-emoji{font-size:92px;line-height:1.1}
.badge-name{font-size:30px;font-weight:900;margin-top:4px}
.score{text-align:center;font-size:31px;font-weight:900;margin:14px 0 6px}
.score-sub{text-align:center;font-size:20px;color:var(--muted);margin-bottom:16px}
.rlist{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:8px}
.rlist li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:#f4f6f9;border-radius:16px;padding:12px 14px}
.rlist .ico{font-size:26px;line-height:1.2}
.rlist .rt{font-size:21px;font-weight:800;line-height:1.35}
.rlist .rf{font-size:19px;color:#3e4858;line-height:1.45;margin-top:2px;word-break:keep-all}
.rbtns{display:flex;flex-direction:column;gap:10px}
.legend{text-align:center;font-size:18px;color:var(--muted);margin-bottom:10px}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
@media (max-height:760px){
  .progress-label{font-size:24px}
  .phone{min-height:560px}
}
</style>
</head>
<body>
<div id="app">
  <div class="progress" aria-live="polite">
    <div class="progress-label" id="progressLabel">미션 1 / 10</div>
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- 스마트폰 시뮬레이터 -->
  <div class="phone" id="phone">
    <div class="speaker"></div>
    <div class="screen">
      <div class="punch"></div>
      <div class="statusbar" aria-hidden="true">
        <span>12:00</span>
        <span class="sb-right">
          <span class="signal"><i></i><i></i><i></i><i></i></span>
          <span class="net">5G</span>
          <span class="wifi"></span>
          <span class="battery"><span class="batt"><i></i></span>100%</span>
        </span>
      </div>
      <div class="scroller" id="scroller">
        <div class="appbar" id="appbar"></div>
        <div class="msgarea" id="msgarea"></div>

        <div class="checkpanel" role="group" aria-label="수상한 점 3가지 확인하기">
          <div class="check-title">🔍 수상한 점 3가지 확인하기</div>
          <div class="qrow" id="row1">
            <div class="qtext"><span class="qnum">1</span><span>모르는 번호나 사람인가요?</span></div>
            <div class="oxgroup">
              <button class="ox o" data-q="1" data-v="1" aria-pressed="false" aria-label="1번 질문 O">O</button>
              <button class="ox x" data-q="1" data-v="0" aria-pressed="false" aria-label="1번 질문 X">X</button>
            </div>
          </div>
          <div class="qrow" id="row2">
            <div class="qtext"><span class="qnum">2</span><span>돈·선물·개인정보를 달라고 하나요?</span></div>
            <div class="oxgroup">
              <button class="ox o" data-q="2" data-v="1" aria-pressed="false" aria-label="2번 질문 O">O</button>
              <button class="ox x" data-q="2" data-v="0" aria-pressed="false" aria-label="2번 질문 X">X</button>
            </div>
          </div>
          <div class="qrow" id="row3">
            <div class="qtext"><span class="qnum">3</span><span>누르라는 파란 글자(링크)나 버튼이 있나요?</span></div>
            <div class="oxgroup">
              <button class="ox o" data-q="3" data-v="1" aria-pressed="false" aria-label="3번 질문 O">O</button>
              <button class="ox x" data-q="3" data-v="0" aria-pressed="false" aria-label="3번 질문 X">X</button>
            </div>
          </div>
          <div class="hintline" id="hintline" aria-live="polite"></div>
        </div>

        <div class="actionbar">
          <div class="actions" id="actions"></div>
          <button class="act adult" id="adultBtn">🙋 어른에게 물어보기 / 보여주기</button>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <!-- 결과 대시보드 -->
  <section class="results" id="results" aria-live="polite"></section>
</div>

<!-- 모달 -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>

<script>
/* =========================================================
   1. 문제 데이터베이스
   - 전화번호: 010-0000-XXXX / 도메인: .example (가상)
   - correctAnswers: q1~q3 의 O(true)/X(false) 정답
   ========================================================= */
const MISSION_DATABASE = [
  /* ---------------- 위험 메시지 (17개) ---------------- */
  {
    id: 1, type: 'sms', isSafe: false, title: '택배 주소 확인 문자',
    sender: '010-0000-1234', senderSub: '저장되지 않은 번호',
    content: '[○○택배] 주소지 불명으로 배송이 중단되었습니다. 아래 링크에서 주소를 수정해 주세요.',
    linkText: '▶ http://delivery-check.example',
    correctAnswers: { q1: true, q2: true, q3: true },
    clues: { senderClue: '010-0000-1234', contentClue: '주소를 수정해 주세요', linkClue: 'delivery-check.example' },
    dangerExplanation: '모르는 번호로 온 택배 링크를 누르면 개인정보를 도둑맞거나 가짜 앱이 깔릴 수 있어요.',
    tip: '택배가 궁금하면 링크 대신 어른에게 물어보거나 공식 택배 앱으로 확인해요.'
  },
  {
    id: 2, type: 'sms', isSafe: false, title: '모바일 청첩장 문자',
    sender: '010-0000-5821', senderSub: '저장되지 않은 번호',
    content: '저희 드디어 결혼합니다 💐 모바일 청첩장을 확인해 주세요. 축의금도 링크에서 보낼 수 있어요.',
    linkText: '▶ http://wedding-card.example',
    correctAnswers: { q1: true, q2: true, q3: true },
    clues: { senderClue: '010-0000-5821', contentClue: '축의금도 링크에서 보낼 수 있어요', linkClue: 'wedding-card.example' },
    dangerExplanation: '모르는 사람이 보낸 청첩장 링크는 가짜 앱을 몰래 설치해서 내 정보를 훔쳐 갈 수 있어요.',
    tip: '아는 사람이 아닌데 온 초대장, 청첩장 링크는 누르지 않고 삭제해요.'
  },
  {
    id: 3, type: 'sms', isSafe: false, title: '무료 치킨 쿠폰 이벤트',
    sender: '010-0000-7777', senderSub: '저장되지 않은 번호',

    clues: { senderClue: '', contentClue: '', linkClue: '' },
    dangerExplanation: '',
    tip: '아는 선생님의 수업 안내는 안전해요. 준비물을 잘 챙겨요.'
  }
];

/* =========================================================
   2. 사운드 엔진 (Web Audio API, 외부 파일 없음)
   ========================================================= */
const Sound = (() => {
  let ctx = null;
  function ac() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) ctx = new AC();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, type = 'sine', vol = 0.25) {
    const c = ac(); if (!c) return;
    const t0 = c.currentTime + start;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }
  return {
    click()   { tone(800, 0, 0.05, 'sine', 0.22); },                         // 버튼 터치음
    o()       { tone(659, 0, 0.16, 'triangle', 0.32); },                     // O 선택 (미)
    x()       { tone(330, 0, 0.16, 'triangle', 0.32); },                     // X 선택 (낮은 미)
    warn()    { tone(220, 0, 0.22, 'square', 0.16); tone(160, 0.25, 0.4, 'square', 0.16); }, // 2단계 경고음
    fanfare() {                                                               // 도-미-솔 팡파르
      tone(523, 0,    0.18, 'triangle', 0.3);
      tone(659, 0.16, 0.18, 'triangle', 0.3);
      tone(784, 0.32, 0.55, 'triangle', 0.3);
      tone(523, 0.32, 0.55, 'sine', 0.12);
      tone(659, 0.32, 0.55, 'sine', 0.12);
    },
    chime()   { tone(1047, 0, 0.7, 'sine', 0.2); tone(784, 0.2, 0.9, 'sine', 0.2); } // 팝업 안내 차임
  };
})();

/* =========================================================
   3. 상태
   ========================================================= */
const ROUND_SIZE = 10;
const S = {
  mode: 'main',          // 'main' | 'review'
  queue: [],             // 이번 라운드 문제
  idx: 0,
  results: [],           // {item, firstTry, via}
  answers: { 1: null, 2: null, 3: null },
  failed: false,         // 현재 문제 첫 시도 실패 여부
  busy: false,
  lastIds: []
};

const $ = (id) => document.getElementById(id);
const phone = $('phone');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function wrapClue(text, clue, cls) {
  if (!clue || text.indexOf(clue) === -1) return esc(text);
  const i = text.indexOf(clue);
  return esc(text.slice(0, i)) + `<span class="hl ${cls}">${esc(clue)}</span>` + esc(text.slice(i + clue.length));
}
function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function pick(pool, n) {
  const fresh = shuffle(pool.filter(p => !S.lastIds.includes(p.id)));
  const used = shuffle(pool.filter(p => S.lastIds.includes(p.id)));
  return fresh.concat(used).slice(0, n);
}

/* =========================================================
   4. 라운드 / 문제 렌더링
   ========================================================= */
function newRound() {
  const danger = MISSION_DATABASE.filter(m => !m.isSafe);
  const safe = MISSION_DATABASE.filter(m => m.isSafe);
  const list = shuffle(pick(danger, 7).concat(pick(safe, 3)));
  S.lastIds = list.map(m => m.id);
  startRound(list, 'main');
}
function startRound(list, mode) {
  S.mode = mode; S.queue = list; S.idx = 0; S.results = [];
  $('results').classList.remove('show');
  phone.style.display = '';
  renderMission();
}
function current() { return S.queue[S.idx]; }

function renderProgress() {
  const total = S.queue.length;
  const label = S.mode === 'review' ? '복습 미션' : '미션';
  $('progressLabel').innerHTML = `${label} <b>${S.idx + 1}</b> / ${total}`;
  let html = '';
  for (let i = 0; i < total; i++) {
    let c = '';
    if (i < S.results.length) c = S.results[i].firstTry ? 'done-ok' : 'done-retry';
    else if (i === S.idx) c = 'now';
    html += `<span class="${c}"></span>`;
  }
  $('progressBar').innerHTML = html;
}

function renderMission() {
  const m = current();
  S.answers = { 1: null, 2: null, 3: null };
  S.failed = false; S.busy = false;
  phone.classList.remove('on1', 'on2', 'on3');
  document.querySelectorAll('.ox').forEach(b => b.setAttribute('aria-pressed', 'false'));
  document.querySelectorAll('.qrow').forEach(r => r.classList.remove('wrong'));
  setHint('');
  renderProgress();

  const senderHTML = `<span class="hl hl1">${esc(m.sender)}</span>`;
  const appbar = $('appbar'), area = $('msgarea');

  if (m.type === 'popup') {
    appbar.innerHTML = `<span class="back">‹</span>
      <div class="addr"><span class="lock">⚠</span><span>${senderHTML}</span></div>`;
    area.className = 'msgarea popup';
    area.innerHTML = `
      <div class="popup-card" id="msgBody">
        <span class="popup-ad">광고</span>
        <div class="popup-title">${esc(m.popupTitle)}</div>
        <p class="popup-text">${wrapClue(m.content, m.clues.contentClue, 'hl2')}</p>
        <button class="danger-btn hl hl3" id="dangerLink">${esc(m.linkText)}</button>
      </div>`;
  } else {
    const unknown = !m.avatar;
    appbar.innerHTML = `<span class="back">‹</span>
      <div class="avatar">${unknown ? '👤' : m.avatar}</div>
      <div><div class="sender-name">${senderHTML}</div>
      <div class="sender-sub">${esc(m.type === 'sms' ? (m.senderSub || '') : (m.type === 'chat' ? '메신저' : ''))}</div></div>`;
    area.className = 'msgarea ' + m.type;
    const stranger = (m.type === 'chat' && m.senderSub === '친구 아님')
      ? `<div class="stranger">⚠ 친구로 등록되지 않은 사람이에요</div>` : '';
    const link = m.linkText ? `<button class="danger-link hl hl3" id="dangerLink">${esc(m.linkText)}</button>` : '';
    area.innerHTML = `
      ${stranger}
      <div class="datechip">오늘 오후 12:00</div>
      <div class="bubble-row" id="msgBody">
        ${m.type === 'chat' ? `<div class="avatar">${unknown ? '👤' : m.avatar}</div>` : ''}
        <div class="bubble">${wrapClue(m.content, m.clues.contentClue, 'hl2')}${link}</div>
        <span class="bubble-time">오후 12:00</span>
      </div>`;
  }

  const dl = $('dangerLink');
  if (dl) dl.addEventListener('click', onDangerClick);

  // 행동 버튼 구성
  const acts = m.type === 'popup'
    ? [['cls', '✕ 팝업 닫기']]
    : [['del', '🗑 삭제'], ['blk', '🚫 차단'], ['ok', '알겠어요 👍']];
  const box = $('actions');
  box.style.gridTemplateColumns = `repeat(${acts.length}, 1fr)`;
  box.innerHTML = acts.map(([k, l]) => `<button class="act ${k} locked" data-act="${k}">${l}</button>`).join('');
  box.querySelectorAll('.act').forEach(b => b.addEventListener('click', () => onAction(b.dataset.act)));

  $('scroller').scrollTop = 0;
}

/* =========================================================
   5. O/X 판별 + 1:1 하이라이트
   ========================================================= */
document.querySelectorAll('.ox').forEach(btn => {
  btn.addEventListener('click', () => {
    if (S.busy) return;
    const q = +btn.dataset.q, v = btn.dataset.v === '1';
    v ? Sound.o() : Sound.x();
    S.answers[q] = v;
    btn.parentElement.querySelectorAll('.ox').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    phone.classList.toggle('on' + q, v);    // O = 하이라이트 ON / X = OFF
    $('row' + q).classList.remove('wrong');
    evaluate(true);
  });
});

function getState() {
  const m = current(), a = S.answers;
  if (a[1] === null || a[2] === null || a[3] === null) return 'incomplete';
  const c = m.correctAnswers;
  return (a[1] === c.q1 && a[2] === c.q2 && a[3] === c.q3) ? 'ready' : 'mismatch';
}

function evaluate(fromClick) {
  const m = current(), st = getState();
  const btns = document.querySelectorAll('#actions .act');
  btns.forEach(b => { b.classList.add('locked'); b.classList.remove('pulse'); });
  document.querySelectorAll('.qrow').forEach(r => r.classList.remove('wrong'));

  if (st === 'ready') {
    btns.forEach(b => {
      b.classList.remove('locked');
      const k = b.dataset.act;
      const good = m.isSafe ? k === 'ok' : (k === 'del' || k === 'blk' || k === 'cls');
      if (good) b.classList.add('pulse');
    });
    setHint(m.isSafe ? '👍 수상한 점이 없어요! 답장 버튼을 눌러 보세요.' : '🚨 수상한 메시지예요! 반짝이는 버튼으로 안전하게 대처해요.', true);
  } else if (st === 'mismatch') {
    const c = m.correctAnswers, a = S.answers;
    const wrong = [1, 2, 3].filter(q => a[q] !== c['q' + q]);
    wrong.forEach(q => $('row' + q).classList.add('wrong'));
    setHint(`🤔 ${wrong.join(', ')}번 질문을 메시지와 다시 비교해 보세요.`);
  } else {
    setHint('');
  }
}
function setHint(t, good) { const h = $('hintline'); h.textContent = t; h.classList.toggle('good', !!good); }

/* =========================================================
   6. 행동 처리 (정답 / 오답 / 재도전)
   ========================================================= */
function onDangerClick(e) {
  e.preventDefault();
  if (S.busy) return;
  const m = current();
  S.failed = true;
  Sound.warn();
  showModal({
    variant: 'danger', icon: '⚠',
    title: '잠깐! 이런 링크나 버튼은 누르면 안 돼요!',
    body: `<div class="dangerbox">${esc(m.dangerExplanation)}</div>
           <p>실제 휴대폰이었다면 위험할 뻔했어요.<br>질문 3가지를 살펴보고 안전하게 대처해 봐요.</p>`,
    buttons: [{ label: '다시 풀어보기', cls: 'red', onClick: closeModal }]
  });
}

function onAction(kind) {
  if (S.busy) return;
  const m = current(), st = getState();
  Sound.click();

  if (st !== 'ready') {
    Sound.chime();
    if (st === 'incomplete') {
      showModal({
        variant: 'notice', icon: '🔍', title: '먼저 수상한 점을 확인해요!',
        body: '<p>아래 질문 3가지에 <b>O</b> 또는 <b>X</b>를 모두 골라 주세요.</p>',
        buttons: [{ label: '확인하러 가기', cls: 'light', onClick: () => { closeModal(); scrollToPanel(); } }]
      });
    } else {
      showModal({
        variant: 'notice', icon: '🤔', title: '다시 한번 살펴봐요!',
        body: '<p>주황색으로 표시된 질문을 메시지와 다시 비교해 보세요.</p>',
        buttons: [{ label: '다시 보기', cls: 'light', onClick: () => { closeModal(); scrollToPanel(); } }]
      });
    }
    return;
  }

  if (m.isSafe) {
    if (kind === 'ok') return succeed('ok');
    // 안전한 메시지를 삭제/차단하려는 경우
    S.failed = true;
    Sound.chime();
    showModal({
      variant: 'notice', icon: '💛', title: '지우지 않아도 괜찮아요!',
      body: '<p>엄마나 선생님이 보낸 안전한 메시지예요. 지우지 말고 <b>[알겠어요 👍]</b>를 눌러보세요!</p>',
      buttons: [{ label: '다시 해 볼게요', cls: 'light', onClick: closeModal }]
    });
    return;
  }

  // 위험 메시지
  if (kind === 'ok') {
    S.failed = true;
    Sound.warn();
    showModal({
      variant: 'danger', icon: '⚠', title: '잠깐! 수상한 메시지에는 답장하면 안 돼요!',
      body: `<div class="dangerbox">답장하면 나쁜 사람이 "이 번호는 진짜 사람이 쓰는구나" 하고 더 많이 속이려고 해요.<br><br>${esc(m.dangerExplanation)}</div>`,
      buttons: [{ label: '다시 풀어보기', cls: 'red', onClick: closeModal }]
    });
    return;
  }
  succeed(kind);
}

function succeed(kind) {
  S.busy = true;
  const body = $('msgBody');
  let delay = 650;
  if (kind === 'del' && body) body.classList.add('removing');
  else if (kind === 'cls' && body) body.classList.add('closing');
  else if (kind === 'blk') toast('🚫 차단했어요');
  else if (kind === 'ok') { toast('📨 답장을 보냈어요'); }
  setTimeout(() => {
    Sound.fanfare();
    const m = current();
    S.results.push({ item: m, firstTry: !S.failed, via: 'action' });
    renderProgress();
    showModal({
      variant: 'success', icon: '👏',
      title: m.isSafe ? '참 잘했어요! 안전한 메시지를 잘 알아봤어요 👏' : '참 잘했어요! 안전하게 대처했어요 👏',
      body: `<div class="tipbox">💡 ${esc(m.tip)}</div>`,
      buttons: [{ label: isLast() ? '결과 보러 가기' : '다음 문제로', cls: 'green', onClick: next }]
    });
  }, delay);
}

function isLast() { return S.idx >= S.queue.length - 1; }
function next() {
  Sound.click();
  closeModal();
  S.idx++;
  if (S.idx >= S.queue.length) showResults();
  else renderMission();
}
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1100);
}
function scrollToPanel() {
  const p = document.querySelector('.checkpanel');
  p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* =========================================================
   7. 어른에게 물어보기 / 보여주기 + 교사 확인(2초 길게 누르기)
   ========================================================= */
$('adultBtn').addEventListener('click', () => {
  if (S.busy) return;
  Sound.chime();
  showModal({
    variant: 'info', icon: '🙋',
    title: '선생님이나 부모님께 폰을 보여주세요!',
    body: '<p>잘 모를 때 어른에게 물어보는 것은<br><b>가장 안전하고 멋진 방법</b>이에요.</p>',
    buttons: [
      { label: '확인 완료 (2초 길게 누르기)', cls: 'purple', hold: true, onDone: teacherPass },
      { label: '돌아가기', cls: 'light', onClick: () => { Sound.click(); closeModal(); } }
    ]
  });
});

function teacherPass() {
  Sound.fanfare();
  const m = current();
  S.busy = true;
  S.results.push({ item: m, firstTry: !S.failed, via: 'adult' });
  renderProgress();
  showModal({
    variant: 'success', icon: '👏',
    title: '선생님과 함께 확인했어요! 👏',
    body: `<p>모르는 것은 어른에게 물어보는 게 가장 안전해요.</p><div class="tipbox">💡 ${esc(m.tip)}</div>`,
    buttons: [{ label: isLast() ? '결과 보러 가기' : '다음 문제로', cls: 'green', onClick: next }]
  });
}

function setupHold(btn, onDone) {
  let timer = null;
  const lbl = btn.querySelector('.lbl'), orig = lbl.textContent;
  const start = (e) => {
    e.preventDefault();
    if (timer) return;
    Sound.click();
    btn.classList.add('holding');
    lbl.textContent = '꾹 누르고 있어요...';
    timer = setTimeout(() => { timer = null; btn.classList.remove('holding'); onDone(); }, 2000);
  };
  const cancel = () => {
    if (timer) { clearTimeout(timer); timer = null; }
    btn.classList.remove('holding'); lbl.textContent = orig;
  };
  btn.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, cancel));
  btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(e); });
  btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') cancel(); });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

/* =========================================================
   8. 모달 시스템
   ========================================================= */
function showModal({ variant, icon, title, body, buttons }) {
  const modal = $('modal');
  modal.className = 'modal ' + (variant || '');
  modal.innerHTML = `
    <div class="modal-icon">${icon || ''}</div>
    <h2>${esc(title)}</h2>
    ${body || ''}
    <div class="mbtns"></div>`;
  const wrap = modal.querySelector('.mbtns');
  (buttons || []).forEach(b => {
    const el = document.createElement('button');
    el.className = 'mbtn ' + (b.cls || '') + (b.hold ? ' holdbtn' : '');
    if (b.hold) {
      el.innerHTML = `<span class="fill"></span><span class="lbl">${esc(b.label)}</span>`;
      setupHold(el, b.onDone);
    } else {
      el.textContent = b.label;
      el.addEventListener('click', b.onClick);
    }
    wrap.appendChild(el);
  });
  // 모달 상태 재설정 (애니메이션 재실행)
  void modal.offsetWidth;
  $('overlay').classList.add('show');
  setTimeout(() => { const f = wrap.querySelector('button'); if (f) f.focus({ preventScroll: true }); }, 50);
}
function closeModal() { $('overlay').classList.remove('show'); }

/* =========================================================
   9. 결과 대시보드 + 다시 풀기
   ========================================================= */
function badgeFor(score, total) {
  const r = total ? score / total : 0;
  if (r >= 0.9) return ['🥇', '보안 지킴이 마스터'];
  if (r >= 0.7) return ['🥈', '멋진 디지털 가드'];
  if (r >= 0.4) return ['🥉', '씩씩한 안전 탐험가'];
  return ['🌱', '쑥쑥 자라는 안전 새싹'];
}

function showResults() {
  phone.style.display = 'none';
  const total = S.results.length;
  const ok = S.results.filter(r => r.firstTry).length;
  const failedItems = S.results.filter(r => !r.firstTry).map(r => r.item);
  const [emo, name] = badgeFor(ok, total);
  const review = S.mode === 'review';

  $('progressLabel').innerHTML = review ? '복습 미션 완료!' : '미션 완료!';
  renderProgressFinal();

  const list = S.results.map((r, i) => {
    const m = r.item;
    let fb;
    if (r.firstTry) fb = r.via === 'adult' ? '🙋 어른과 함께 안전하게 확인했어요' : (m.isSafe ? '👍 안전한 메시지를 잘 알아봤어요' : '👍 첫 시도에 안전하게 막아냈어요');
    else fb = '💡 ' + m.tip;
    return `<li><span class="ico">${r.firstTry ? '🟢' : '🔴'}</span>
      <div><div class="rt">${i + 1}. ${esc(m.title)}</div><div class="rf">${esc(fb)}</div></div></li>`;
  }).join('');

  let headline = `${total}개 중 ${ok}개 성공! 🎉`;
  let sub = review ? '복습 라운드 결과예요.' : '첫 시도에 완벽하게 막아낸 개수예요.';
  if (review && failedItems.length === 0) sub = '틀렸던 문제를 모두 해결했어요! 🏆';

  const btns = [];
  if (failedItems.length) btns.push(`<button class="mbtn red" id="retryWrong">❌ 틀렸던 문제만 다시 풀기 (${failedItems.length}개)</button>`);
  btns.push(`<button class="mbtn green" id="retryNew">🔄 처음부터 새로운 10문제 풀기</button>`);

  const box = $('results');
  box.innerHTML = `
    <div class="badge"><div class="badge-emoji">${emo}</div><div class="badge-name">${name}</div></div>
    <div class="score">${headline}</div>
    <div class="score-sub">${sub}</div>
    <div class="legend">🟢 첫 시도 성공 &nbsp; 🔴 재도전 통과</div>
    <ul class="rlist">${list}</ul>
    <div class="rbtns">${btns.join('')}</div>`;
  box.classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  const rw = $('retryWrong');
  if (rw) rw.addEventListener('click', () => { Sound.click(); startRound(shuffle(failedItems), 'review'); });
  $('retryNew').addEventListener('click', () => { Sound.click(); newRound(); });
}
function renderProgressFinal() {
  $('progressBar').innerHTML = S.results.map(r => `<span class="${r.firstTry ? 'done-ok' : 'done-retry'}"></span>`).join('');
}

   10. 시작 화면 (첫 터치로 오디오 활성화)
